   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Day 6 - Task 3: Persistent Task Manager</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    .completed { text-decoration: line-through; color: gray; }
    .empty-state { color: #888; font-style: italic; }
  </style>
</head>
<body>

  <h1>My Tasks</h1>
  
  <form id="task-form">
    <input type="text" id="task-input" placeholder="Add a new task..." required>
    <button type="submit">Add Task</button>
  </form>

  <div style="margin: 15px 0;">
    <button class="filter-btn" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
  </div>

  <ul id="task-list"></ul>

  <p>Remaining tasks: <span id="remaining-count">0</span></p>
  <button id="clear-all-btn" style="background: crimson; color: white;">Clear All Data</button>

  <script src="script.js"></script>
</body>
</html>
