<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 3</title>
  </head>
  <body>
    <h2 id="header-text">Original Header</h2>
    <button id="change-btn">Change Heading</button>

    <div style="margin-top: 20px">
      <button id="minus-btn">-</button>
      <span id="counter-value">0</span>
      <button id="plus-btn">+</button>
      <button id="reset-btn">Reset</button>
    </div>

    <div style="margin-top: 20px">
      <button id="toggle-btn">Hide Box</button>
      <div id="box" style="width: 100px; height: 100px; background: red"></div>
    </div>

    <div style="margin-top: 20px">
      <input type="text" id="user-input" placeholder="Type something..." />
      
      <p>You typed: <span id="live-text"></span></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
